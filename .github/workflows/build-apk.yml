name: APK bauen

# Baut Relock zu einer installierbaren APK zusammen.
#
# Nötig, weil die Umgebung, in der der Code geschrieben wird, keinen Zugriff
# auf dl.google.com / maven.google.com hat (siehe README.md). Hier auf den
# GitHub-Runnern ist das Netz offen.
#
# Lokal wird vorher mit tools/typpruefen.sh gegen Compose Multiplatform
# typgeprüft — das fängt Typ- und Überladungsfehler schon vor dem Push.

on:
  push:
    branches:
      - claude/kopfgeld-app-ui-design-wrhlc3
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug-APK bauen
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cachen
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: gradlew ausfuehrbar machen
        run: chmod +x ./gradlew

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: relock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Lint (nur melden, nicht scheitern lassen)
        if: always()
        run: ./gradlew :app:lintDebug --stacktrace || true

      - name: Lint-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-bericht
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
